{% extends "base.html" %}

{% block title %}Server Error | Smart Resume Analyzer{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-2">500</div>
        <h3 class="fw-bold text-dark mb-3">Unexpected Server Error</h3>
        <p class="text-muted col-md-6 mx-auto mb-4">
            An internal server error occurred while processing your request. Please try uploading your document again.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 fw-semibold">
            <i class="bi bi-arrow-clockwise me-2"></i> Try Again
        </a>
    </div>
</div>
{% endblock %}
